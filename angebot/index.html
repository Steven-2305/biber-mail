<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Ihr Solarangebot – Biber Photovoltaik</title><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--red:#BE000D;--ink:#1D1D1F;--mute:#6B6F76;--line:#E2E3E6;--soft:#F6F6F7;--ok:#1E7F4F}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#F1F1F2}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}header img{height:34px}
main{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:6px 0 4px}.sub{color:var(--mute);margin:0 0 18px}
.trust{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.trust div{background:#fff;border:2px solid var(--red);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}.trust div.k{border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.rec{border:2px solid var(--red);box-shadow:0 8px 24px #be000d22}
.ch{padding:12px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}.ch b{font-size:18px}.badge{background:#fff;color:var(--red);font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
.cb{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.kwp{font-size:26px;font-weight:800}.kwp small{font-size:13px;color:var(--mute);font-weight:500;display:block}
ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kp div{background:var(--soft);border-radius:8px;padding:7px 9px}.kp span{font-size:11px;color:var(--mute);display:block}.kp b{font-size:16px}
.pr{border-top:1px solid var(--line);padding-top:10px}.pr .v{font-size:24px;font-weight:800}.pr .r{color:var(--mute);font-size:14px}.pr .o{font-size:13px;color:var(--mute);margin-top:4px}
.mon{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.mon h2,.ct h2{font-size:17px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.ct{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ct img{width:84px;height:84px;border-radius:50%;object-fit:cover}.ct .bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ct a{display:inline-block;padding:11px 16px;border-radius:10px;font-weight:700;text-decoration:none;font-size:15px}.ct a.w{background:#25D366;color:#fff}.ct a.t{background:var(--ink);color:#fff}.ct a.m{background:var(--soft);color:var(--ink)}
.small{font-size:12px;color:var(--mute);margin-top:16px;line-height:1.5}
.err{background:#fff;border-radius:14px;padding:24px;text-align:center}
.ctl{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.lb{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{display:block;font-size:12px;color:var(--mute);margin-top:6px}
.dw input{width:130px;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px}
.opts{border:1px dashed #C9CBD0;border-radius:10px;padding:8px 10px}.opt{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0}.opt input{width:20px;height:20px}.opt b{margin-left:auto}
.vbn{background:#EEF6EE;border:1px solid #BFE0C3;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}.vbn.ex{background:#FFF1F0;border-color:#F5B5B0}.vbn a{color:#BE000D;font-weight:700;margin-left:6px}
.pick{display:block;width:100%;margin-top:12px;padding:13px;border-radius:10px;border:2px solid #BE000D;background:#fff;color:#BE000D;font-weight:700;font-size:15px;cursor:pointer}.pick.rec{background:#BE000D;color:#fff}
.pk{margin-top:10px;display:flex;flex-direction:column;gap:8px}.pk p{margin:0;font-size:13px;color:#555}.pk a{display:block;text-align:center;padding:11px;border-radius:10px;text-decoration:none;font-weight:700;background:#F2F2F2;color:#222}.pk a.w{background:#25D366;color:#fff}.pk a.m{background:#222;color:#fff}
.cb2{background:#BE000D!important;color:#fff!important}
.mhd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.mhd h2{margin:0!important}
.mrow{display:grid;grid-template-columns:150px 1fr 95px 70px;align-items:center;gap:10px;width:100%;padding:8px 6px;border:0;border-radius:8px;background:none;font:inherit;color:inherit;text-align:left}
button.mrow{cursor:pointer}.mrow.sel{background:#FFF1F0}.mrow.sel .ml{font-weight:700}.ml small{color:#777;font-size:12px}
.mbar{height:22px;background:#F0F0F0;border-radius:5px;display:flex;overflow:hidden}.mbar i{display:block;height:100%}.m0{background:#7D828B}.m1{background:#BE000D}.m2{background:#E8A317}
.mrow b{text-align:right;font-size:16px}.mrow em{font-style:normal;font-weight:700;text-align:right}.mrow em.pos{color:#0A7D3B}.mrow em.neg{color:#BE000D}
.mleg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#666;margin:6px 0 0 6px}.mleg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mafter{margin-top:12px;background:#EAF6EE;border-radius:10px;padding:11px 14px;font-size:15px}
.bank{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.55;color:#333;background:#FAFAFA}
@media(max-width:640px){.mrow{grid-template-columns:92px 1fr 72px;gap:6px}.mrow em{grid-column:3;font-size:13px}.mrow b{font-size:14px}.ml small{display:block}}
.mbw{min-width:0}.m1{position:relative}.m1 span{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.mbd{font-size:11.5px;color:#666;margin-top:3px;line-height:1.35}.mrow.sel .mbd{color:#333}
.m1 span{font-style:normal}.mbar i{font-style:normal}
@media(max-width:640px){.mrow{grid-template-columns:1fr auto auto!important;row-gap:4px}.mrow .mbw,.mrow>.mbar{grid-column:1/-1;order:5}.mrow em{grid-column:auto!important}.ml small{display:inline!important;margin-left:4px}}
.kp .big{grid-column:span 1;background:#F4F7FB}.kp .big small{display:block;font-size:11px;color:#777;margin-top:2px}.kp .big.g{background:#EAF6EE}.kp .big.g b{color:#0A7D3B}
</style></head>
<body><header><img src="logo.png" alt="Biber Photovoltaik"><span style="color:var(--mute);font-size:13px">Ihr persönliches Angebot</span></header>
<main id="m"></main>
<script>
const COL = ['#7D828B', '#BE000D', '#1D1D1F'];
const nf = (v, d = 0) => (isFinite(v) ? v : 0).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = v => nf(v) + ' €', eur2 = v => nf(v, 2) + ' €';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CAT = {"cat": {"m": {"m460": "Solarfabrik Mono S4 Halfcut Trend Full Black 460W", "m480": "Solarfabrik Mono S4 BC 480W Full Black – Limited Edition"}, "i": {"a6": "Alpha SMILE-G3-T6 Hybrid Wechselrichter", "a8": "Alpha SMILE-G3-T8 Hybrid Wechselrichter", "a10": "Alpha SMILE-G3-T10 Hybrid Wechselrichter", "a15": "Alpha SMILE-G3-T15 Hybrid Wechselrichter", "a20": "Alpha SMILE-G3-T20 Hybrid Wechselrichter", "k4": "Kostal Plenticore S G3 4,0 kW", "k85": "Kostal Plenticore M G3 8,5 kW", "kp10": "Kostal PLENTICORE plus 10", "k15": "Kostal Plenticore L G3 15 kW", "f12": "Hybridwechselrichter FOXESS H3-12.0-E WIFI", "fr125": "FRONIUS SYMO 12.5-3-M"}, "b": {"a38": "Alpha SMILE-G3-BAT-3.8S", "a93": "AlphaESS SMILE-G3-BAT-9.3S", "dyn": "Dyness HV9640 Batteriemodul 3,84 kWh", "byd": "BYD Battery-Box Batteriemodul HVS+ 2,56 kWh", "sma": "SMA Home Storage 3.2 kWh Batteriespeicher"}, "e": {"wbA": "Alpha-ESS SMILE-G3-EVCT11 Wallbox", "wbAk": "Alpha-ESS SMILE-G3-EVCT11 Ladekabel", "wbE": "EVBox Elvi 11kW schwarz", "rfid": "Fronius Wattpilot RFID Tags", "wbM": "Montage/Installation einer Wallbox", "kw25": "Wallbox Kabelweg ab 15 m bis 25 m", "kw35": "Wallbox Kabelweg ab 26 m bis 35 m", "bbA": "Alpha Backup Box Plus", "nuK": "Enwitec Netzumschaltbox Kostal Plenticore G3 (D/CH)", "bsK": "KOSTAL BackUp Switch G3", "zs2": "Zählerschrank (2-Feld), alter bleibt Unterverteilung", "zs3": "Neuer Zählerschrank (3-Feld), alter bleibt Unterverteilung", "kv3": "Kleinverteiler 3-reihig", "spg": "Spezialgerüst Pauschalbetrag je Dachseite"}}, "f": {"n": "Steven Jentschke", "r": "Ihr PV-Fachberater vor Ort", "p": "05362 9752550", "e": "jentschke@biber-pv.de", "w": "https://wa.me/message/LOAQJFKYLLIIA1?src=qr", "b": "Unser Best-Preis-Versprechen", "s": "Seit über 20 Jahren Ihr Photovoltaik-Partner"}};
const nm = (t, id) => (CAT.cat[t] && CAT.cat[t][id]) || id;
function fromB64(h) { h = h.replace(/-/g, '+').replace(/_/g, '/'); while (h.length % 4) h += '='; return Uint8Array.from(atob(h), c => c.charCodeAt(0)); }
async function decode() {
  const h = location.hash.slice(1); if (!h) return null;
  let bytes; if (h[0] === 'z') { const st = new Blob([fromB64(h.slice(1))]).stream().pipeThrough(new DecompressionStream('deflate-raw')); bytes = new Uint8Array(await new Response(st).arrayBuffer()); } else bytes = fromB64(h[0] === 'j' ? h.slice(1) : h);
  const a = JSON.parse(new TextDecoder().decode(bytes));
  if (!Array.isArray(a)) return a;
  const [, g, d, va, rec, t, cons, P, fin, down, stand] = a;
  return { gn: g, fin: fin || [[t, 5, 5.1]], down: down || 0, stand: stand || '', g: 'Sehr geehrte' + (/^Herr /.test(g) ? 'r ' : ' ') + g, d, va, rec, t, cons, f: CAT.f, p: P.map(q => ({ n: q[0], m: q[2] + ' × ' + nm('m', q[1]), i: nm('i', q[3]), b: q[4] ? q[5] + ' × ' + nm('b', q[4]) : '', x: (q[6] || []).map(id => nm('e', id)), a: q[7], s: q[8], y1: q[9], am: q[10] < 0 ? null : q[10] / 10, gn: q[11], ir: q[12] < 0 ? null : q[12] / 10, gr: q[13], ra: q[14], og: q[15], oc: q[16] ? q[16].split('+') : [], td: q[17], wp: q[18], kwp: q[19] / 100, kwh: q[20] / 10, oi: q[21] || (q[15] ? [[q[16] || 'Optionen', q[15]]] : []), bd: q[22] || null })) };
}
(async () => { let D = null; try { D = await decode(); } catch (e) { }
const m = document.getElementById('m');
if (!D || !D.p) m.innerHTML = '<div class="err"><h1>Angebot nicht gefunden</h1><p class="sub">Bitte öffnen Sie den vollständigen Link aus unserer E-Mail.</p></div>';
else {
  const F = D.f || {}, S = { t: D.t, down: D.down, sel: D.p.map(p => (p.oi || []).map(() => false)) };
  const ann = (L, nom, y) => { if (L <= 0) return 0; const r = nom / 1200, n = y * 12; return r ? L * r / (1 - Math.pow(1 + r, -n)) : L / n; };
  const fin = () => D.fin.find(f => +f[0] === +S.t) || D.fin[0];
  const tot = (p, i) => p.gr + (p.oi || []).reduce((s, o, j) => s + (S.sel[i][j] ? o[1] : 0), 0);
  const rate = (p, i) => ann(tot(p, i) - S.down, fin()[1], S.t);
  const vd = (() => { const x = String(D.d || '').match(/(\d+)\.(\d+)\.(\d{4})/); if (!x) return null; const t = new Date(+x[3], +x[2] - 1, +x[1]); t.setDate(t.getDate() + (+D.va || 14)); t.setHours(23, 59, 59); return t; })();
  const exp = vd && vd < new Date(), vds = vd ? vd.toLocaleDateString('de-DE') : '';
  let pick = null, mp = D.rec || 0;
  const selTxt = i => { const p = D.p[i], ops = (p.oi || []).filter((o, j) => S.sel[i][j]).map(o => o[0]); return `Hallo ${F.n || ''},\n\nich interessiere mich für das Paket ${p.n} (${nf(p.kwp, 2)} kWp${p.kwh ? ', ' + nf(p.kwh, 1) + ' kWh Speicher' : ''})${ops.length ? ' mit ' + ops.join(' und ') : ''} – Gesamtpreis ${eur(tot(p, i))}${S.t ? `, Finanzierung über ${S.t} Jahre${S.down ? ' mit ' + eur(S.down) + ' Anzahlung' : ''} (ca. ${eur(rate(p, i))} im Monat)` : ''}.\n\nBitte melden Sie sich bei mir, um die nächsten Schritte zu besprechen.\n\nViele Grüße\n${D.gn || ''}`; };
  const mailto = (sub, body) => F.e ? `mailto:${F.e}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}` : '';
  function draw() {
    const f = fin();
    m.innerHTML = `<h1>${esc(D.g)},</h1><p class="sub">hier finden Sie Ihre drei Varianten im direkten Vergleich – persönlich für Sie erstellt${F.n ? ' von ' + esc(F.n) : ''} am ${esc(D.d)} für einen Strombedarf von rund ${nf(D.cons)} kWh im Jahr.</p>
   ${vd ? (exp ? `<div class="vbn ex"><b>Dieses Angebot ist am ${vds} abgelaufen.</b> Melden Sie sich kurz – ich prüfe die aktuellen Preise und schicke Ihnen eine neue Version.${F.p ? ` <a href="tel:${esc(F.p.replace(/[^\d+]/g, ''))}">Jetzt anrufen</a>` : ''}</div>` : `<div class="vbn">Ihr Angebot ist gültig bis <b>${vds}</b>.</div>`) : ''}
   <div class="trust">${F.b ? `<div>€ ${esc(F.b)}</div>` : ''}${F.s ? `<div class="k">★ ${esc(F.s)}</div>` : ''}</div>
   <div class="grid">${D.p.map((p, i) => `<article class="card ${i === D.rec ? 'rec' : ''}"><div class="ch" style="background:${COL[i]}"><b>${esc(p.n)}</b>${i === D.rec ? '<span class="badge">EMPFEHLUNG</span>' : ''}</div><div class="cb">
     <div class="kwp">${nf(p.kwp, 2)} kWp<small>${p.kwh ? 'mit ' + nf(p.kwh, 1) + ' kWh Batteriespeicher' : 'ohne Batteriespeicher'}</small></div>
     <ul><li>${esc(p.m)}</li><li>${esc(p.i)}</li>${p.b ? `<li>${esc(p.b)}</li>` : ''}${(p.x || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
     <div class="kp"><div><span>Autarkie</span><b>${p.a} %</b></div><div><span>Ersparnis 1. Jahr</span><b>${eur(p.y1)}</b></div><div><span>Amortisation</span><b>${p.am === null ? '–' : nf(p.am, 1) + ' Jahre'}</b></div><div><span>Rendite p. a.</span><b>${p.ir === null ? '–' : nf(p.ir, 1) + ' %'}</b></div>
       <div class="big"><span>Ersparnis in 20 Jahren</span><b>${eur(p.gn + p.gr)}</b><small>Stromkosten + Einspeisevergütung</small></div><div class="big g"><span>Ihr Gewinn nach Abzug der Anlage</span><b>${eur(p.gn)}</b><small>Anlagenpreis bereits abgezogen</small></div></div>
     ${(p.oi || []).length ? `<div class="opts"><span class="lb">Optional dazu</span>${p.oi.map((o, j) => `<label class="opt"><input type="checkbox" data-o="${i}.${j}" ${S.sel[i][j] ? 'checked' : ''}> ${esc(o[0])} <b>+${eur(o[1])}</b></label>`).join('')}</div>` : ''}
     <div class="pr"><div class="r">Gesamtpreis (Endbetrag)</div><div class="v">${eur(tot(p, i))}</div><div class="r">oder ca. <b>${eur(rate(p, i))}</b> monatlich bei ${S.t} Jahren${S.down ? ` und ${eur(S.down)} Anzahlung` : ''}</div></div>
     <button class="pick ${i === D.rec ? 'rec' : ''}" data-pick="${i}">Dieses Paket wählen</button>
     ${pick === i ? `<div class="pk"><p>Wie möchten Sie mir Ihre Auswahl schicken?</p>${F.e ? `<a class="m" href="${esc(mailto('Meine Auswahl: Paket ' + p.n, selTxt(i)))}">Per E-Mail senden</a>` : ''}${F.w ? `<a class="w" href="${esc(F.w)}" data-wacopy="${i}">Per WhatsApp (Text wird kopiert)</a>` : ''}${F.p ? `<a class="t" href="tel:${esc(F.p.replace(/[^\d+]/g, ''))}">Lieber anrufen</a>` : ''}</div>` : ''}
   </div></article>`).join('')}</div>
   <section class="ctl" style="margin-top:16px"><div><span class="lb">Finanzierung – Laufzeit</span><div class="chips">${D.fin.map(x => `<button class="chip ${+x[0] === +S.t ? 'on' : ''}" data-t="${x[0]}">${x[0]} Jahre</button>`).join('')}</div><span class="hint">Sollzins ${nf(f[1], 2)} % · effektiv ${nf(f[2], 2)} % p. a.</span></div>
    <div><span class="lb">Anzahlung</span><div class="dw"><input id="down" type="number" inputmode="numeric" min="0" step="500" value="${S.down}"> €</div></div></section>
   ${(() => { const i = mp, p = D.p[i], T = tot(p, i), L = Math.max(0, T - S.down), rows = D.fin.map(x => { const r = ann(L, x[1], +x[0]); return { y: +x[0], nom: x[1], eff: x[2], r, sum: r + p.wp, df: p.td - r - p.wp }; }), mx = Math.max(p.td, ...rows.map(x => x.r + Math.max(0, p.wp)), 1), ops = (p.oi || []).filter((o, j) => S.sel[i][j]).map(o => o[0]);
     return `<section class="mon"><div class="mhd"><h2>Ihr Monat im Vergleich – Paket ${esc(p.n)}</h2><div class="chips">${D.p.map((q, j) => `<button class="chip ${j === i ? 'on' : ''}" data-mp="${j}">${esc(q.n)}</button>`).join('')}</div></div>
      <p class="hint">Kreditrate + laufende Kosten (${p.bd ? `Reststrom ${eur(p.bd[0])} − Einspeisung ${eur(p.bd[1])} + Betrieb ${eur(p.bd[2])}` : 'Reststrom − Einspeisung + Betrieb'} = ${eur(p.wp)} im Monat)${ops.length ? ' · inkl. ' + esc(ops.join(' + ')) : ''}${S.down ? ' · ' + eur(S.down) + ' Anzahlung' : ''}</p>
      <div class="mrow"><span class="ml">Heute ohne PV</span><div class="mbar"><i class="m0" style="width:${p.td / mx * 100}%"></i></div><b>${eur(p.td)}</b><em></em></div>
      ${rows.map(x => `<button class="mrow ${x.y === +S.t ? 'sel' : ''}" data-t="${x.y}"><span class="ml">${x.y} Jahre <small>${nf(x.eff, 2)} % eff.</small></span><div class="mbw"><div class="mbar"><i class="m1" style="width:${x.r / mx * 100}%"><span>${eur(x.r)}</span></i><i class="m2" style="width:${Math.max(0, p.wp) / mx * 100}%"></i></div><div class="mbd">Rate ca. ${eur(x.r)}${p.bd ? ` · Reststrom ${eur(p.bd[0])} · Einspeisung −${eur(p.bd[1])} · Betrieb ${eur(p.bd[2])}` : ` · laufende Kosten ${eur(p.wp)}`}</div></div><b>ca. ${eur(x.sum)}</b><em class="${x.df >= 0 ? 'pos' : 'neg'}">${x.df >= 0 ? '−' : '+'}${eur(Math.abs(x.df))}</em></button>`).join('')}
      <div class="mleg"><span><i class="m1"></i>Kreditrate</span><span><i class="m2"></i>laufende Kosten</span><span>rechts: Differenz zu heute pro Monat</span></div>
      <div class="mafter">Nach Ende der Finanzierung zahlen Sie nur noch rund <b>${eur(p.wp)} pro Monat</b> statt ${eur(p.td)} – eine Ersparnis von rund <b>${eur(p.td - p.wp)} monatlich</b>.</div>
      <div class="bank"><b>Finanzierungsbeispiele Paket ${esc(p.n)}</b> (Nettodarlehensbetrag ${eur2(L)}): ${rows.map(x => `${x.y} Jahre: gebundener Sollzinssatz ${nf(x.nom, 2)} % p. a., effektiver Jahreszins ${nf(x.eff, 2)} %, ${x.y * 12} monatliche Raten à ${eur2(x.r)}, Gesamtbetrag ${eur2(x.r * x.y * 12)}`).join('; ')}. Sollzinsbindung = Gesamtlaufzeit. Darlehensgeber: ${esc(F.bk || 'Finanzierungspartner der Biber Photovoltaik GmbH')}${D.stand ? ', Konditionen Stand ' + esc(D.stand) : ''}. Bonität vorausgesetzt; maßgeblich ist das Vertragsangebot des Darlehensgebers.</div>
      <p class="hint" style="margin-top:8px">Kennzahlen wie Autarkie, Amortisation und Rendite gelten für die Anlage ohne optionale Positionen.</p></section>`; })()}
